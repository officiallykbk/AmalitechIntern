<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box;  }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
</head>
<body>
  <H1>SocketIO Chat</H1>
  
  <ul id="messages"></ul>
  <form id="form" action="" onsubmit="return false;">
    <input id="sender" autocomplete="off" placeholder="name" />
    <input id="input" autocomplete="off" placeholder="message" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script type="module" >
      import { io } from "https://cdn.socket.io/4.8.1/socket.io.esm.min.js";
      const socket = io("http://localhost:3000");

      const messenger = document.getElementById('messages');
      const typer = document.getElementById('input');
      const sender = document.getElementById('sender')
      const former = document.getElementById('form')
      
      former.addEventListener('submit',()=>{
        event.preventDefault ()
          let message= typer.value
          socket.emit('message',{user:sender.value, message: message})
          typer.value = ''
          sender.value = ''
      })
      socket.on('received',(data)=>{
        console.log(data.message)
          let li = document.createElement('li')
          li.textContent =`From: ${data.user} to ${data.message}`
          messenger.appendChild(li)
      })
  </script>
</body>
</html>
